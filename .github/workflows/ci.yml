name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test (types)
        run: pnpm run test:types
      - name: Test (lint)
        run: pnpm run test:lint
      - name: Build
        run: pnpm run build
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps --only-shell
      - name: Test (e2e) [skip visual]
        run: pnpm run test:e2e --grep-invert @visual
      - name: Upload Pages artifact
        # if: github.ref == 'refs/heads/main' # TODO: UNCOMMENT BEFORE MERGE
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # if: github.ref == 'refs/heads/main' # TODO: UNCOMMENT BEFORE MERGE
    needs: ci
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
